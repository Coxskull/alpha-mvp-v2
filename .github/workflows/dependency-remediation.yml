name: Dependency remediation validation

on:
  pull_request:
  push:
    branches:
      - security/dependency-remediation-20261011

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-and-validate:
    name: Regenerate lockfile and validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate lockfile without package lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Install regenerated locked dependencies
        run: npm ci

      - name: Dependency audit report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          console.log("Dependency vulnerability totals:");
          console.log(JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
          console.log("Affected packages:");
          for (const [name, finding] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: finding.severity,
              direct: finding.isDirect,
              range: finding.range,
              advisories: (finding.via ?? []).map((item) =>
                typeof item === "string"
                  ? item
                  : { title: item.title, url: item.url, range: item.range }
              ),
              fixAvailable: finding.fixAvailable
            }));
          }
          NODE

      - name: Upload regenerated lockfile and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-evidence
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
        run: npm run build

      - name: Commit regenerated lockfile after successful validation
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/security/dependency-remediation-20261011'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const path = "package-lock.json";
            const content = fs.readFileSync(path).toString("base64");
            const current = await github.rest.repos.getContent({
              owner, repo, path, ref: branch
            });
            if (Array.isArray(current.data) || !current.data.sha) {
              throw new Error("Could not resolve current package-lock.json blob SHA");
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: "chore(security): commit regenerated dependency lockfile",
              branch,
              sha: current.data.sha,
              content
            });
            core.info("Committed the lockfile generated and tested by this workflow.");
